[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinal-trace"
version = "0.1.5"
description = "Local-first AI security exposure prevention: detect, redact, and block secrets before they leave the machine"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Sentinal Trace Contributors" }]
keywords = [
    "security",
    "secrets",
    "prompt-security",
    "preflight",
    "mcp",
    "redaction",
    "local-first",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "build>=1.0",
    "ruff>=0.6",
    "mypy>=1.8",
    "types-PyYAML>=6.0",
    "pip-audit>=2.7",
    "bandit>=1.7",
]

[project.scripts]
sentinal-trace = "sentinal_trace.cli:app"
sentinal-trace-mcp = "sentinal_trace.mcp.server:run_stdio_server"

[project.urls]
Documentation = "https://github.com/sentinal-trace/sentinal-trace#readme"
Repository = "https://github.com/sentinal-trace/sentinal-trace"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinal_trace"]

[tool.hatch.build.targets.sdist]
include = ["src/sentinal_trace", "README.md", "LICENSE", "docs", "configs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --tb=short"
markers = [
    "integration: tests that hit real network services (opt-in)",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
no_implicit_optional = true
ignore_missing_imports = true
files = ["src/sentinal_trace"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.bandit]
targets = ["src"]
exclude_dirs = ["tests", "examples"]

[tool.coverage.run]
source = ["sentinal_trace"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
